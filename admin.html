<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Ledger — Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="admin.js" type="module"></script>
</head>
<body>

    <header>
        <h1>Admin</h1>
    </header>

    <main>

        <!-- ===== SECTION 1: the PIN lock =====
             First time ever: shows a form to type in names + set a PIN.
             Every time after: just asks for the PIN. -->
        <section id="pinSection">
            <div id="pinGate">
                <button type="button" id="togglePinBtn" class="toggle-pin-btn">Show</button>
            </div>
        </section>

        <!-- ===== SECTION 2: manage who's in the rotation =====
             Hidden until the PIN is entered correctly. -->
        <section id="manageSection" hidden>
            <h2>Rotation</h2>
            <div id="payerList"></div>
            <input id="newPayerName" type="text" placeholder="Add a name">
            <button id="addPayerBtn">Add</button>
        </section>

        <!-- ===== SECTION 2b: manage who's in the WEEKLY food rotation =====
             Separate list from the monthly one -- Maricela/Javier/Ofelia,
             cycling every week instead of every month. -->
        <section id="weeklyManageSection" hidden>
            <h2>Weekly Rotation (Food)</h2>
            <div id="weeklyPayerList"></div>
            <input id="newWeeklyPayerName" type="text" placeholder="Add a name">
            <button id="addWeeklyPayerBtn">Add</button>
        </section>

        <!-- ===== SECTION 3: year view, click a month to reassign it or mark it paid ===== -->
        <section id="yearSection" hidden>
            <h2>Year Overview</h2>
            <button id="yearPrev">&lsaquo;</button>
            <span id="yearLabel">2026</span>
            <button id="yearNext">&rsaquo;</button>
            <div id="yearGrid"></div>
            <div id="editPanel" hidden></div>
        </section>

        <!-- ===== SECTION 4: full history list, with an edit link on each row ===== -->
        <section id="historySection" hidden>
            <h2>History</h2>
            <div id="historyList"></div>
        </section>

        <!-- ===== link back to the family page -- moved up here so it
             sits above the "Start Over" section, not lost at the very bottom ===== -->
        <footer>
            <a href="index.html">Back to family page</a>
        </footer>

        <!-- ===== SECTION 5: wipes everything and starts fresh -----
             Useful for fixing test data, or if the rotation setup
             needs to be redone from scratch. -->
        <section id="resetSection" hidden>
            <h2>Start Over</h2>
            <p>This erases the rotation, PIN, and all saved months. There's no undo.</p>
            <button id="resetAllBtn" class="remove-btn">Erase everything and start over</button>
        </section>

    </main>

</body>
</html>
